[package]
name = "qubit-mime"
version = "0.21.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-mime"
description = "MIME type detection utilities for Rust based on filename glob rules and content magic"
homepage = "https://github.com/qubit-ltd/rs-mime"
documentation = "https://docs.rs/qubit-mime"
readme = "README.md"
keywords = ["mime", "detection", "media-type", "file", "qubit"]
categories = ["filesystem", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_mime"
doctest = true

[features]
inventory = ["qubit-spi/inventory"]

[dependencies]
regex = "^1.13"
roxmltree = "^0.21"
thiserror = "^2.0"

qubit-io = "0.19"

qubit-fs = { path = "../rs-fs", version = "0.3", default-features = false, features = ["async"] }

qubit-codec-misc = { path = "../rs-codec-misc", version = "0.8" }
qubit-command = { path = "../rs-command", version = "0.11" }
qubit-config = { path = "../rs-config", version = "0.15" }
qubit-datatype = { path = "../rs-datatype", version = "0.15", default-features = false, features = ["converter"] }
qubit-local-files = { path = "../rs-local-files", version = "0.5" }
qubit-spi = { version = "0.13" }

[patch.crates-io]
qubit-redact = { path = "../rs-redact" }

[dev-dependencies]
qubit-fs-local = { path = "../rs-fs-local", version = "0.11" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[bench]]
name = "command_backends"
harness = false
