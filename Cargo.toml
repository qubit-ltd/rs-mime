[package]
name = "qubit-mime"
version = "0.22.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-mime"
description = "MIME type detection utilities for Rust based on filename glob rules and content magic"
homepage = "https://github.com/qubit-ltd/rs-mime"
documentation = "https://docs.rs/qubit-mime"
readme = "README.md"
keywords = ["mime", "detection", "media-type", "file", "qubit"]
categories = ["filesystem", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/doc/**/user_guide*.md",
    "/doc/acceptance-0.22.0-operation-0.2.zh_CN.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_mime"
doctest = true

[features]
inventory = ["qubit-spi/inventory"]

[dependencies]
regex = "^1.13"
roxmltree = "^0.21"
thiserror = "^2.0"

qubit-io = "^0.19.6"
qubit-operation = { version = "^0.3.2", path = "../rs-operation" }

qubit-fs = { version = "^0.4", path = "../rs-fs", default-features = false, features = ["async"] }

qubit-codec-misc = "^0.8"
qubit-command = { version = "^0.11" }
qubit-config = { version = "^0.15" }
qubit-datatype = { version = "^0.15", default-features = false, features = ["converter"] }
qubit-local-files = { version = "^0.6", path = "../rs-local-files" }
qubit-spi = "^0.14"


[dev-dependencies]
qubit-fs-local = { version = "^0.11", path = "../rs-fs-local" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[test]]
name = "mod"
path = "tests/mod_tests.rs"

[[test]]
name = "operation_api_consumer"
path = "tests/operation_api_consumer_tests.rs"

[[bench]]
name = "command_backends"
harness = false

[[bench]]
name = "repository_matching"
harness = false

[workspace]

[patch.crates-io]
qubit-local-files = { path = "../rs-local-files" }
qubit-operation = { path = "../rs-operation" }
