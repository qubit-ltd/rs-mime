[package]
name = "qubit-mime"
version = "0.9.1"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-mime"
description = "MIME type detection utilities for Rust based on filename glob rules and content magic"
homepage = "https://github.com/qubit-ltd/rs-mime"
documentation = "https://docs.rs/qubit-mime"
readme = "README.md"
keywords = ["mime", "detection", "media-type", "file", "qubit"]
categories = ["filesystem", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_mime"
doctest = true

[dependencies]
regex = "1.12"
roxmltree = "0.21"
thiserror = "2.0"

qubit-io = "0.7"
qubit-codec-misc = { path = "../rs-codec-misc", version = "0.2" }
qubit-command = { version = "0.5", path = "../rs-command" }
qubit-config = { path = "../rs-config", version = "0.14" }
qubit-local-files = { path = "../rs-local-files", version = "0.6" }
qubit-spi = { path = "../rs-spi", version = "0.8" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
