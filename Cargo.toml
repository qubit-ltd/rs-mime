[package]
name = "qubit-mime"
version = "0.18.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-mime"
description = "MIME type detection utilities for Rust based on filename glob rules and content magic"
homepage = "https://github.com/qubit-ltd/rs-mime"
documentation = "https://docs.rs/qubit-mime"
readme = "README.md"
keywords = ["mime", "detection", "media-type", "file", "qubit"]
categories = ["filesystem", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_mime"
doctest = true

[features]
inventory = ["qubit-spi/inventory"]

[dependencies]
regex = "^1.13"
roxmltree = "^0.21"
thiserror = "^2.0"

qubit-io = "0.17"
qubit-fs = { version = "0.2", default-features = false, features = ["async"] }
qubit-codec-misc = "0.6"
qubit-command = "0.10"
qubit-config = "0.14.3"
qubit-datatype = { version = "0.14", default-features = false, features = ["converter"] }
qubit-local-files = "0.4"
qubit-spi = { version = "0.13" }

[dev-dependencies]
qubit-fs-local = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[bench]]
name = "command_backends"
harness = false
