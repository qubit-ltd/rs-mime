name: Magika inventory consumer

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.infra/ci/local-path-dependencies.tsv'
      - 'tests/fixtures/magika_inventory_consumer/**'
      - '.github/workflows/magika-consumer.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.infra/ci/local-path-dependencies.tsv'
      - 'tests/fixtures/magika_inventory_consumer/**'
      - '.github/workflows/magika-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  magika-inventory-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rs-mime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rs-mime
      - name: Checkout pinned sibling source graph
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-magika
          ref: 4aab7b4889d2ee3c03373b3a186f56c91412f7d6
          path: rs-magika
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-operation
          ref: 893bcf6c7efb397cc8fac2f7fe18fb5e87017e63
          path: rs-operation
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs
          ref: 2d725c9b3bd0926dbbaf77428ab3596b08af0a47
          path: rs-fs
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-registry
          ref: be7c9c956829d8b48061b78f02b9a04972a61f54
          path: rs-fs-registry
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-local-files
          ref: c3ff0ae78836bf52f65e2f8f7c4b9f69c37c9b9e
          path: rs-local-files
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-local
          ref: f7630dd357c96109644545bd010942b164ebf10a
          path: rs-fs-local
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-testkit
          ref: 28bf195b8eef9c03d9cb1c5428186758b76aaacd
          path: rs-fs-testkit
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Download and verify ONNX Runtime 1.24.2
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/onnxruntime-1.24.2-cp311-cp311-manylinux_x86_64.whl"
          curl --fail --location --silent --show-error \
            https://files.pythonhosted.org/packages/2c/32/4e5921ba8b82ac37cad45f1108ca6effd430f49c7f20577d53f317d166ed/onnxruntime-1.24.2-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl \
            --output "$wheel"
          echo '93fe190ee555ae8e9c1214bcfcf13af85cd06dd835e8d835ce5a8d01056844fe  '"$wheel" | sha256sum --check
          mkdir "$RUNNER_TEMP/onnxruntime"
          unzip -q "$wheel" -d "$RUNNER_TEMP/onnxruntime"
          echo "ORT_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime/onnxruntime/capi/libonnxruntime.so.1.24.2" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime/onnxruntime/capi:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Record pinned source graph
        run: |
          for repo in rs-mime rs-magika rs-operation rs-fs rs-fs-registry rs-local-files rs-fs-local rs-fs-testkit; do
            printf '%s ' "$repo"
            git -C "$repo" rev-parse HEAD
          done
      - name: Verify one operation package identity
        working-directory: rs-mime
        run: |
          set -euo pipefail
          fixture=tests/fixtures/magika_inventory_consumer/Cargo.toml
          cargo +1.94.0 tree --locked --manifest-path "$fixture" -i qubit-operation
          cargo +1.94.0 tree --locked --manifest-path "$fixture" -i qubit-operation --features inventory
      - name: Run explicitly registered Magika consumer
        working-directory: rs-mime
        run: cargo +1.94.0 run --locked --manifest-path tests/fixtures/magika_inventory_consumer/Cargo.toml
      - name: Run inventory discovered Magika consumer
        working-directory: rs-mime
        run: cargo +1.94.0 run --locked --manifest-path tests/fixtures/magika_inventory_consumer/Cargo.toml --features inventory
