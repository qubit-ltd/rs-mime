name: Documentation consumer

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-documentation-consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sources/rs-mime
    steps:
      - name: Checkout rs-mime under sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: sources/rs-mime
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Install FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify FFprobe version
        run: ffprobe -version
      - name: Prepare pinned local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Run real FFprobe integration smoke
        run: cargo test --locked --test mod real_ffprobe_integration_tests -- --ignored
      - name: Compile documentation consumer
        run: cargo check --manifest-path tests/fixtures/documentation_consumer/Cargo.toml --locked
      - name: Run managed lifecycle example
        run: cargo run --example managed_lifecycle --locked
      - name: Run documentation consumer fixture
        run: cargo run --manifest-path tests/fixtures/documentation_consumer/Cargo.toml --locked
      - name: Run operation consumer lifecycle and budget assertions
        run: cargo run --locked --manifest-path tests/fixtures/operation_consumer/Cargo.toml
