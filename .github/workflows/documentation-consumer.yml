name: Documentation consumer

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-documentation-consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sources/rs-mime
    steps:
      - name: Checkout rs-mime under sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: sources/rs-mime
      - name: Checkout rs-fs dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs
          ref: bbb7a5d269f2f3a955fcd25839177eae4795898f
          path: sources/rs-fs
      - name: Checkout rs-fs-local development dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-local
          ref: 1067ff1ffe75376f2349c2a484ccf2423e29d20e
          path: sources/rs-fs-local
      - name: Checkout rs-fs-registry transitive dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-registry
          ref: f979cd4425d9a50ea0a3ca5544ab94a8bffad31b
          path: sources/rs-fs-registry
      - name: Checkout rs-fs-testkit transitive dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-testkit
          ref: 72af3d22362de9884c77e0bcaadbccfca4725a35
          path: sources/rs-fs-testkit
      - name: Checkout rs-operation transitive dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-operation
          ref: 7fcda0375286f9466dbdfbb63d720d10c88fb423
          path: sources/rs-operation
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Compile documentation consumer
        run: cargo check --manifest-path tests/fixtures/documentation_consumer/Cargo.toml --locked
      - name: Compile operation consumer
        run: cargo check --manifest-path tests/fixtures/operation_consumer/Cargo.toml --locked
